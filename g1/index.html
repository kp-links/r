<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リダイレクト中...</title>
  <script>
    (function () {
      var urls = [
        { url: "https://www.amazon.co.jp/s/?keywords=%E3%82%B0%E3%83%AB%E3%82%B3%E3%82%B5%E3%83%9F%E3%83%B3&ie=UTF8&field-asin=B0D7V6PPH1&rh=i:aps,ssx:relevance", weight: 60.0 },
        { url: "https://www.amazon.co.jp/s/?keywords=%E3%82%B3%E3%83%B3%E3%83%89%E3%83%AD%E3%82%A4%E3%83%81%E3%83%B3&ie=UTF8&field-asin=B0D7V6PPH1&rh=i:aps,ssx:relevance", weight: 40.0 }
      ];
      var rand = Math.random() * 100;
      var cumulative = 0;
      for (var i = 0; i < urls.length; i++) {
        cumulative += urls[i].weight;
        if (rand < cumulative) {
          window.location.replace(urls[i].url);
          break;
        }
      }
    })();
  </script>
</head>
<body><p>リダイレクト中...</p></body>
</html>
