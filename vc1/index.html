<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リダイレクト中...</title>
  <script>
    (function () {
      var urls = [
        { url: "https://www.amazon.co.jp/s/?keywords=%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3C&ie=UTF8&field-asin=B0CQ5F6PWG&rh=i:aps,ssx:relevance", weight: 73.33 },
        { url: "https://www.amazon.co.jp/s/?keywords=%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3C%20%E3%82%B5%E3%83%97%E3%83%AA&ie=UTF8&field-asin=B0CQ5F6PWG&rh=i:aps,ssx:relevance", weight: 26.67 }
      ];
      var rand = Math.random() * 100;
      var cumulative = 0;
      for (var i = 0; i < urls.length; i++) {
        cumulative += urls[i].weight;
        if (rand < cumulative) {
          window.location.replace(urls[i].url);
          break;
        }
      }
    })();
  </script>
</head>
